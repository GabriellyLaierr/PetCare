<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro e Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Lado Esquerdo -->    
    <div id="container-esquerdo">
        <header id="topo-esquerdo">
            <img src="../imgs/logoIMG/logo.png" alt="logo" id="img-logo">
            <h1><span class="cor-pet">Pet</span><span class="cor-care">Care</span></h1>
        </header>

        <div>
            <img src="../imgs/animaisIMG/animais.png" alt="animais" id="img-animais">
        </div> 


        <div>
            <h2>Bem-vindo ao <span class="cor-pet">Pet</span><span class="cor-care">Care</span>!</h2>
            <p>O melhor lugar para gerenciar a saúde, vacinas e rotina de todos os seus melhores amigos em um só lugar.</p>
        </div>
    </div>

    <!-- Lado Direito -->    


    <div id="container-direito">
        <header id="topo-direito">
            <h1>Crie sua conta</h1>
            <p>Ja tem uma conta?<a href="../login/index.html" target="_self"> Entre aqui</a></p>
        </header>

        <form id="formulario">
            <div class="form-group">
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
            </div>

            <div class="form-group">
                <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirmar Senha" required>
            </div>

        <p class="link-prestador"><a href="../servicos/cadastro/index.html">Sou prestador de serviço e desejo me cadastrar</a></p>
            <div id="termos-uso">
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Aceito os <a href="./termoPrivacidade/index.html" target="_blank">Termos de Uso</a> e <a href="./termoPrivacidade/index.html" target="_blank">Política de Privacidade</a></label>
            </div>

            <div id="container-botao">
                <button type="submit" id="cadastrar">Cadastrar</button>

            </div>
        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
