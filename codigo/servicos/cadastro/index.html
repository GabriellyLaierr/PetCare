<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare - Cadastro Prestador de Serviços</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <!-- Lado Esquerdo (Identidade Visual igual ao Tutor) -->
        <section class="left-panel">
            <header class="brand">
                <img src="../../imgs/logoIMG/logo.png" alt="Logo PetCare" class="logo-img">
                <h1><span class="cor-pet">Pet</span><span class="cor-care">Care</span></h1>
            </header>

            <div>
                <img src="../../imgs/animaisIMG/servicos.png" alt="Animais" class="img-animais">
            </div>

            <div class="brand-text">
                <h2>Bem-vindo ao <span class="cor-pet">Pet</span><span class="cor-care">Care</span>!</h2>
                <p>O melhor lugar para fornecer serviços pet. Cadastre sua clínica, farmácia ou pet shop e alcance mais clientes!</p>
            </div>
        </section>

        <!-- Lado Direito -->
        <section class="right-panel">
            <div class="form-box">
                <h2>Cadastro de Parceiro</h2>
                <p class="subtitle">Preencha os dados para divulgar seu serviço no PetCare</p>

                <form id="form-cadastro-servico">
                    <div class="input-group">
                        <label for="cad-nome">Nome do Estabelecimento / Profissional *</label>
                        <input type="text" id="cad-nome" placeholder="Ex: Clínica Vet Amigo" required>
                    </div>

                    <div class="input-group">
                        <label for="cad-tipo">Tipo de Serviço *</label>
                        <select id="cad-tipo" required>
                            <option value="" disabled selected>Selecione a categoria...</option>
                            <option value="Veterinário">Veterinário / Clínica</option>
                            <option value="Farmácia Veterinária">Farmácia Veterinária</option>
                            <option value="Pet Shop">Pet Shop</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="cad-email">E-mail Comercial *</label>
                        <input type="email" id="cad-email" placeholder="contato@empresa.com" required>
                    </div>

                    <div class="input-group">
                        <label for="cad-senha">Crie uma Senha *</label>
                        <input type="password" id="cad-senha" placeholder="Mínimo 4 caracteres" required>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="cad-termos" required>
                        <label for="cad-termos">
                            Li e aceito os <a href="../../cadastro/termoPrivacidade/index.html" target="_blank">Termos e Condições</a>
                        </label>
                    </div>

                    <button type="submit" class="btn-orange">Criar Conta de Prestador</button>
                </form>

                <div class="links-footer">
                    <p>Já possui cadastro? <a href="../login/index.html">Fazer login</a></p>
                    <p class="link-tutor"><a href="../../cadastro/index.html">Sou tutor(a) e quero cadastrar meu pet</a></p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
